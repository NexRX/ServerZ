[package]
name = "serverz"
version = "0.1.0"
edition = "2024"

[dependencies]
server-z-macros = { path = "ServerZ-macros" }
jiff = "0.2"
toasty = { version = "0.11", features = ["sqlite", "jiff"] }
toasty-cli = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
topcoat = { version = "0.12", default-features = false, features = [
    "asset",
    "discover",
    "font-fontsource",
    "icon-iconify",
    "router",
    "runtime",
    "serve",
    "tailwind",
    "ui",
    "view",
    "anyhow"
] }
serde = { version = "1.0.229", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
constcat = "0.6.1"
anyhow = "1.0"
garde = { version = "0.23.0", features = ["full"] }
schemars = { version = "1.2.3", features = ["preserve_order"] }

[build-dependencies]
topcoat = { version = "0.12", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }
reqwest = { version = "0.13", features = ["blocking"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
